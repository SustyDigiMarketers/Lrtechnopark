name: LR Techno Park CI/CD & Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Typecheck & Static Lint
        run: npm run lint

      - name: Compile Full-Stack Production Artifacts
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare SPA Fallback & Domain Setup
        run: |
          cp dist/index.html dist/404.html
          echo "lrtechnopark.com" > dist/CNAME
          touch dist/.nojekyll
          echo "lrtechnopark.com" > docs/CNAME
          touch docs/.nojekyll
          test -f dist/index.html || exit 1
          echo "Deployment bundle ready."

      # Method 1: Deploy to 'gh-pages' branch (Works 100% reliably without requiring API site creation)
      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: lrtechnopark.com
          keep_files: false

      # Method 2: Upload GitHub Pages Artifact for Native Actions deployment
      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-native-pages:
    name: Deploy to GitHub Pages (Actions Mode)
    needs: build-and-deploy
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
